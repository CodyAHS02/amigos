<!-- ==================================================
     CHATBOT WIDGET
================================================== -->
<div class="chatbot-widget" id="chatbotWidget">

    <div class="chatbot-panel" id="chatbotPanel">

        <div class="chatbot-header">
            <div class="chatbot-header-info">
                <img src="assets/ChatBox-Girl.webp" alt="Assistant" class="chatbot-header-avatar">
                <div>
                    <h4>Amigos Maler</h4>
                    <span class="chatbot-status"><i class="chatbot-dot"></i> Online</span>
                </div>
            </div>
            <button class="chatbot-close" id="chatbotClose" aria-label="Close chat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </div>

        <div class="chatbot-body" id="chatbotBody">
            <div class="chatbot-message bot">
                <img src="assets/ChatBox-Girl.webp" alt="" class="chatbot-msg-avatar">
                <div class="chatbot-bubble">Hi 👋 how can we help you today?</div>
            </div>
        </div>

        <div class="chatbot-footer">
            <form class="chatbot-form" id="chatbotForm">
                <input type="text" id="chatbotInput" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="chatbot-send" aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </form>
        </div>

    </div>

    <button class="chatbot-toggle" id="chatbotToggle" aria-label="Open chat" aria-expanded="false">
        <img src="assets/ChatBox-Girl.webp" alt="Chat with us" class="chatbot-toggle-img">
        <span class="chatbot-badge" title="Chat with us">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="currentColor" />
            </svg>
        </span>
        <span class="chatbot-toggle-close-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
            </svg>
        </span>
    </button>

</div>

<!-- ==================================================
     SCROLL TO TOP
================================================== -->
<button class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 19V5M12 5l-7 7M12 5l7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
            stroke-linejoin="round" />
    </svg>
</button>
